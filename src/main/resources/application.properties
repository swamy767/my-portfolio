spring.application.name=Springapllication

# ── Database ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=Swamy@2005
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────
# ddl-auto=update → Hibernate creates/alters tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Do NOT set database-platform manually; let Hibernate 6 auto-detect it
# (the old org.hibernate.dialect.PostgreSQLDialect was removed in Hibernate 6)

# ── Logging (optional – shows auth-related SQL) ────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

# ── Thymeleaf (disable cache so HTML changes show immediately) ─────
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
server.port=${PORT:8080}